<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda de Videojuegos{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #0d0f17;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-custom {
            background: linear-gradient(180deg, #16192b 0%, #0d0f17 100%);
            border-bottom: 2px solid #2d3748;
        }
        .card-game {
            background-color: #1a1e2e;
            border: 1px solid #2d3748;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-game:hover {
            transform: translateY(-5px);
            border-color: #7c3aed;
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.25);
        }
        .badge-genre {
            background-color: #7c3aed;
            color: #fff;
        }
        .price-tag {
            color: #10b981;
            font-size: 1.25rem;
            font-weight: bold;
        }
        footer {
            margin-top: auto;
            border-top: 1px solid #232736;
            background-color: #0b0d14;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-warning d-flex align-items-center gap-2" href="#">
                <i class="bi bi-controller text-danger"></i> Tienda de Videojuegos
            </a>
            <div class="d-flex gap-2">
                <a href="#modalAgregar" data-bs-toggle="modal" class="btn btn-primary fw-bold d-flex align-items-center gap-2 shadow-sm">
                    <i class="bi bi-plus-circle-fill"></i> Añadir Videojuego
                </a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container my-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-3 text-secondary">
        <p class="mb-0 small">Tienda de Videojuegos &copy; 2026 - CRUD en Django</p>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
