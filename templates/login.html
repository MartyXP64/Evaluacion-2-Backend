{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Tienda de Videojuegos</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body style="background-color: #1a1a2e; color: white;">

    <div style="max-width: 400px; margin: 100px auto; background-color: #16213e; padding: 30px; border-radius: 10px;">
        <h2 style="text-align: center; margin-bottom: 20px;">Acceso Administrador</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" style="width: 100%; padding: 10px; background-color: #0f3460; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Entrar
            </button>
        </form>
        
        {% if form.errors %}
            <p style="color: #e94560; text-align: center; margin-top: 15px;">Usuario o contraseña incorrectos.</p>
        {% endif %}
    </div>

</body>
</html>
